[workspace]
name = "rapid-ww-metagenomics"
description = "v1 wastewater viral metagenomics pipeline (Nextflow): Deacon depletion, BBTools read QC, sylph and EsViritu calling"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

# One environment holds Nextflow, nf-test, every pipeline tool and the bin/ Python libs.
# Locally, Nextflow processes inherit this PATH (the spec's mono-image approach).
[dependencies]
nextflow = "==26.10.4"
nf-test = "==0.9.5"
# Spec pins Deacon 0.19.1, which is not on bioconda yet; 0.18.0 is the newest packaged.
deacon = "==0.18.0"
# NVD's pin for bbduk.sh / clumpify.sh.
bbmap = ">=39.19,<40"
sylph = "==1.0.0"
esviritu = "==1.3.5"
multiqc = "==1.35"
sra-tools = "==3.4.1"
jq = "*"
sracha = ">=0.5.0"
python = "3.12.*"
polars = "*"
biopython = "*"
pyyaml = "*"
pytest = "*"
samtools = ">=1.25,<2"

[tasks]
# Seam A: bin/ scripts.
test-python = "pytest tests/python -q -p no:cacheprovider --basetemp=.scratch/pytest"
# Seams B and C: Nextflow processes and the whole pipeline.
test-nf = "nf-test test --verbose"
make-test-data = "python bin/make_test_data.py --spec tests/data/test_data_spec.yaml --out-dir tests/data/generated && PATH=$PWD/bin:$PATH bash tests/data/build_test_references.sh"
